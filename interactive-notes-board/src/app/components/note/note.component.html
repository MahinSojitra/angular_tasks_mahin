<div class="card h-100 rounded-4 position-relative overflow-hidden" appHighlight [appAutoColor]="note.text">
  <div class="card-body d-flex flex-column">
    <p class="text-dark fw-semibold fs-5 flex-grow-1">
      {{ note.text }}
    </p>
  </div>
  <div class="card-footer bg-transparent border-0 text-end">
    <button class="btn btn-sm btn-danger rounded-pill" (click)="deleteNote()" title="Delete this note">
      <i class="bi bi-trash3-fill me-1"></i> Delete
    </button>
  </div>
</div>
