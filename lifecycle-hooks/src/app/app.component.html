<div class="container bg-body-secondary mt-3 p-3 rounded">
  <div>
    <span class="d-inline mb-0">Parent component</span>
    <h1>
      App Component
    </h1>
  </div>

  <button class="btn btn-sm btn-success mt-2" (click)="onCounterClick()">Counter: {{counter}}</button>


  <div class="card mt-4 p-4" *ngIf="counter <= 5">
    <app-child [counter]="counter"></app-child>
  </div>

  <p class="m-0 text-end">
    <small>Check the console for lifecycle hooks logs.</small>
  </p>
</div>
